name: ERP checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: era_test
          POSTGRES_PASSWORD: era_test
          POSTGRES_DB: era_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U era_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://era_test:era_test@localhost:5432/era_test
      TEST_DATABASE_URL: postgresql://era_test:era_test@localhost:5432/era_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Verify migration/schema parity
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel packages/database/prisma/schema.prisma --exit-code
      - run: npm test
      - run: npm run build
