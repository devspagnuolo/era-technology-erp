services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: era
      POSTGRES_PASSWORD: era
      POSTGRES_DB: era
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U era"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis:/data"]
    command: redis-server --appendonly yes
volumes:
  postgres:
  redis:
