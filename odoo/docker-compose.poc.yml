services:
  odoo:
    build:
      context: ..
      dockerfile: odoo/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: era_odoo
      PASSWORD: era_odoo_local_only
      ODOO_DB_NAME: era_odoo_poc
      ODOO_MASTER_PASSWORD: era-local-master-only
      ODOO_ADMIN_PASSWORD: era-local-admin-only
      ODOO_RUN_INIT: "true"
      ODOO_INIT_MODULES: base,l10n_br_base,era_connector
    ports: ["8069:8069"]
    volumes: ["odoo-data:/var/lib/odoo"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: era_odoo_poc
      POSTGRES_USER: era_odoo
      POSTGRES_PASSWORD: era_odoo_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U era_odoo -d era_odoo_poc"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: ["odoo-postgres:/var/lib/postgresql/data"]
volumes:
  odoo-data:
  odoo-postgres:
