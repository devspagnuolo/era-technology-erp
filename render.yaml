# Serviços pequenos para a primeira implantação; revisar o custo no Render antes de aplicar.
services:
  - type: pserv
    name: era-api
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @era/api
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm run start -w @era/api
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: era-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
  - type: web
    name: era-admin
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w @era/admin
    startCommand: npm run start -w @era/admin
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: pserv
          name: era-api
          property: hostport
  - type: worker
    name: era-worker
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @era/worker
    startCommand: npm run start -w @era/worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: era-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: era-redis
          property: connectionString
  - type: keyvalue
    name: era-redis
    plan: 256mb
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
databases:
  - name: era-db
    databaseName: era
    user: era
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
