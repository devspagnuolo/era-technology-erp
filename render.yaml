services:
  - type: web
    name: era-api
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm run build -w @era/api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w @era/api
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: era-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_ORIGIN
        sync: false
  - type: web
    name: era-admin
    runtime: node
    buildCommand: npm ci && npm run build -w @era/admin
    startCommand: npm run start -w @era/admin
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        sync: false
  - type: worker
    name: era-worker
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm run build -w @era/worker
    startCommand: npm run start -w @era/worker
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: era-db
          property: connectionString
      - key: REDIS_URL
        sync: false
databases:
  - name: era-db
    databaseName: era
    user: era
